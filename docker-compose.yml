version: '3.8'
services:
  app:
    build: .
    container_name: stockone_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8001:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=stockone
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    command: bash -c "chmod +x wait-for-it.sh && ./wait-for-it.sh db 3306 -- php artisan migrate --seed && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.0
    container_name: stockone_db
    restart: always
    environment:
      MYSQL_DATABASE: stockone
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: stockone_redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: stockone_mailhog
    ports:
      - "8025:8025"

  adminer:
    image: adminer
    container_name: stockone_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  db_data:
